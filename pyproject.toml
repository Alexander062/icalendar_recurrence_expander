[project]
name = "icalendar-recurrence-expander"
version = "0.1.1"
description = "Expands RRULE recurrence rules from iCalendar data into concrete datetime instances within a range."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
